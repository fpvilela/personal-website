- project-id: onedrive-pdf-data-extractor
  title: Automação Python para Extração de Dados Documentais no OneDrive
  short-title: OneDrive PDF Extractor
  year: 2024
  summary: Projeto desenvolvido em Python para automatizar a leitura de arquivos específicos armazenados em uma conta corporativa do OneDrive. 
  bullets:
    - Integration with Microsoft Graph API to access corporate files and folders on OneDrive.
    - Authentication with MSAL to obtain an access token and securely consume the Microsoft API.
    - Automated navigation through shared company folder structures.
    - Reading and filtering of client folders based on business rules.
    - Automatic download of specific PDFs, such as forms and procedural documents.
    - Extraction of structured data from PDFs using pdfplumber.
    - Identification of receipt numbers, addresses, and personal information in official documents.
    - Handling of accented and varied filenames using unicodedata and regex.
    - Pagination of Microsoft Graph API results with support for @odata.nextLink.
    - Organization of extracted data in a Client class with multiple associated processes.
    - Use of environment variables to separate development and production configurations.
    - Reduction of manual work in checking and collecting information from corporate documents
  skills:
    - python
    - microsoft-graph-api
    - onedrive
    - msal
    - oauth
    - api-integration
    - git
    - gitlab
    - pdf-parsing
    - pdfplumber
    - requests
    - regex
    - process-automation
    - document-automation
    - data-extraction

- project-id: pipedrive-crm-learnig-documentation
  title: Pipedrive CRM Learning Documentation
  short-title: Pipedrive CRM Docs
  year: 2024
  summary: Created structured learning documentation about Pipedrive CRM, covering core
    concepts, sales pipeline management, contacts, leads, deals, activities,
    email synchronization, account configuration, and sales insights. The
    documentation was organized to support practical understanding of CRM
    workflows and how Pipedrive can be used to manage sales processes from lead
    capture to deal closing.
  bullets:
    - Documented the main Pipedrive CRM entities, including contacts, organizations, leads, deals, activities, products, and insights.
    - Explained how sales pipelines work, including deal probability, stage probability, rotting deals, list view, and forecast view.
    - Mapped the deal management workflow, covering detailed views, sidebars, communication history, notes, activities, documents, invoices, and focus sections.
    - Organized guidance on contact management, including people, organizations, contact synchronization, filters, and timeline usage.
    - Documented lead management features such as lead inbox, lead conversion, LeadBooster, chatbot, live chat, and prospector tools.
    - Explained Pipedrive email management features, including Smart BCC, full email sync, sales inbox, email templates, tracking, group emails, signatures, and sharing settings.
    - Covered activity and calendar management, including calendar synchronization, activity scheduling, pipeline activity prioritization, and meeting scheduler usage.
    - Structured account setup topics such as company account settings, user permissions, personal preferences, data import/export, custom fields, and security tracking.
    - Summarized sales reporting concepts in Pipedrive Insights, including reports, goals, dashboards, lead reports, deal reports, and performance metrics.
  skills:
    - pipedrive-crm
    - sales-pipeline-management
    - lead-management
    - deal-management
    - business-process-mapping
    - technical-writing
    - process-analysis

